<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTUBER</title>
<meta name="description" content="Launch a VTuber: upload a character, write its personality and deploy its coin on pump.fun from your own wallet.">
<meta property="og:title" content="VTUBER">
<meta property="og:image" content="https://vtuber-pad.vercel.app/assets/og.png">
<meta name="twitter:image" content="https://vtuber-pad.vercel.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1a0b2e">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/fav-32.png">
<link rel="apple-touch-icon" href="/assets/fav-180.png">
<link rel="preload" href="/assets/mochiy.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/vt.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="bg" aria-hidden="true"></canvas>
<nav class="nav" aria-label="Main"><span></span><div class="links"><a href="/#live">Live</a><a href="/#how">How it works</a><a href="/#obs">Stream it</a><a href="/#faq">FAQ</a><a class="go" href="/launch" aria-current="page">Launch</a></div><span></span></nav>
<main id="main" class="lp">
  <form id="form" novalidate>
    <h1>Launch a <span class="v">VTuber</span>.</h1>
    <div class="box">
      <h3>Your character</h3>
      <label class="drop" id="drop"><span class="th" id="thumb"></span><span><b id="dropT">Drop your character here</b><span>PNG with a transparent background works best. Only upload a character you own or made.</span></span><input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Character image"></label>
      <div class="tools" id="imgTools" hidden><button type="button" class="btn sm lemon" id="rmbg">Remove background</button><span>Flat background? One click cuts your character out.</span></div>
    </div>
    <div class="box">
      <h3>Identity</h3>
      <div class="two">
        <div class="fld"><label for="fName">Name <small id="cName">0/32</small></label><input type="text" id="fName" maxlength="32" placeholder="e.g. Mochi Byte" autocomplete="off"></div>
        <div class="fld"><label for="fTick">Ticker <small>2–10</small></label><input type="text" id="fTick" maxlength="10" placeholder="MOCHI" autocomplete="off"></div>
      </div>
      <div class="fld"><label for="fBio">Bio <small id="cBio">0/200</small></label><textarea id="fBio" maxlength="200" placeholder="Who is this VTuber? One or two lines viewers will see."></textarea></div>
      <div class="fld"><label for="fX">X link <small>optional</small></label><input type="url" id="fX" placeholder="https://x.com/yourhandle" autocomplete="off"></div>
    </div>
    <div class="box">
      <h3>Personality</h3>
      <div class="fld"><label>Traits <small>pick up to 2</small></label><div class="chips" id="traits"></div></div>
      <div class="fld"><label for="fCatch">Catchphrase <small id="cCatch">0/60</small></label><input type="text" id="fCatch" maxlength="60" placeholder="e.g. stay cozy, chat" autocomplete="off"></div>
      <div class="fld"><label>Voice <small>when a viewer turns sound on</small></label><div class="chips" id="voices"></div></div>
    </div>
    <div class="box">
      <h3>Launch on pump.fun</h3>
      <div class="fld"><label for="fBuy">Dev buy <small>SOL, optional</small></label><div class="chips" id="buys"></div><input type="number" id="fBuy" min="0" max="50" step="0.01" value="0" inputmode="decimal"></div>
      <button class="btn pink big" id="launchBtn" type="submit" disabled>Connect wallet &amp; launch</button>
      <ol class="log" id="log" hidden></ol>
      <div class="born" id="born" hidden></div>
    </div>
  </form>
  <aside class="prev">
    <div class="win">
      <div class="studio" style="grid-template-columns:1fr"><div class="stage" id="pvStage"><span class="live off corner"><i></i><span>OFF AIR</span></span></div></div>
    </div>
    <div class="under"><button type="button" class="btn sm cyan" id="hear">Hear it</button></div>
  </aside>
</main>
<script type="module" src="/js/launch.js"></script>
</body>
</html>
